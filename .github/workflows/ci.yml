name: RPG foundation verification
# Pushes to feature branches are covered by their pull request run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # GodotPlugins requests net8 with LatestMajor by default; keep hosted .NET 10
  # preinstalls from silently changing the engine host runtime.
  DOTNET_ROLL_FORWARD: LatestPatch
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.408
            9.0.203
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.6.1
          use-dotnet: true
          include-templates: false
      - run: python3 tools/pack-dungeon-rules.py
      - run: git diff --exit-code -- game/data/dungeon_rules.json
      - run: dotnet build
      - name: Import assets before enabling editor plugins
        run: python3 tools/import-project.py
      - name: Engine integration and population benchmarks
        run: python3 tools/verify.py --headless
      - name: Rendered input, dialogue and UI verification
        run: xvfb-run -a python3 tools/verify.py --visual
      - name: Phone layout and touch UI verification
        run: xvfb-run -a python3 tools/verify.py --visual --mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-rpg-evidence
          path: |
            docs/native-screenshots/
            docs/audio-samples/
            docs/verification.json
            docs/render-verification*.json
            build/dungeon/
            build/encounter-measurements.json
            build/verification-*.log
  preserved-reference:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/mosslight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/mosslight/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.408
            9.0.203
      - run: npm ci
      - run: npm run art
      - run: git diff --exit-code -- src/anatomy.json 'public/art/*.json'
      - run: npm test
      - run: npm run build
